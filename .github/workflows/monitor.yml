name: Website Monitor

on:
  workflow_dispatch:
    inputs:
      run_browser_smoke:
        description: Run the browser job manually
        required: true
        type: boolean
        default: true
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

jobs:
  http-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: HTTP check
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 20 "https://www.abdulsamad.shop")
          echo "HTTP status: $code"
          if [ "$code" -ge 400 ] || [ "$code" -eq 0 ]; then
            echo "::error::site returned $code"
            exit 1
          fi

  browser-smoke:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_browser_smoke == true)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Record trigger time
        run: echo "TRIGGER_UTC=$(date -u +%Y-%m-%dT%H:%M:%S)" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome Stable
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Xvfb, OpenVPN, Edge and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openvpn \
            fonts-liberation fonts-noto fonts-noto-color-emoji \
            fonts-dejavu fonts-freefont-ttf fonts-crosextra-carlito \
            fonts-crosextra-caladea ttf-mscorefonts-installer
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
            | gpg --dearmor | sudo tee /usr/share/keyrings/microsoft.gpg > /dev/null
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/edge stable main" \
            | sudo tee /etc/apt/sources.list.d/microsoft-edge.list
          sudo apt-get update
          sudo apt-get install -y microsoft-edge-stable || true

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel selenium undetected-chromedriver pyvirtualdisplay requests

      - name: Restore persistent identities
        uses: actions/cache/restore@v4
        with:
          path: .chrome-profiles
          key: chrome-profiles-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            chrome-profiles-

      - name: Run smoke test
        env:
          RESIDENTIAL_PROXY: ${{ secrets.RESIDENTIAL_PROXY }}
          RESIDENTIAL_SHARE: ${{ vars.RESIDENTIAL_SHARE }}
        run: python scripts/smoke.py

      - name: Save persistent identities
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .chrome-profiles
          key: chrome-profiles-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish summary
        if: always()
        run: |
          {
            echo "### Smoke run"
            echo '```'
            cat reports/summary.txt 2>/dev/null || echo "no summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-reports
          path: reports/
          if-no-files-found: ignore
          retention-days: 3