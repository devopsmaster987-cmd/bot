name: Website Monitor

# ---------------------------------------------------------------------------
# PRIMARY TRIGGER: external pinger (cron-job.org / Cloudflare Worker)
#
#   URL:    https://api.github.com/repos/devopsmaster987-cmd/bot/actions/workflows/monitor.yml/dispatches
#   Method: POST
#   Header: Authorization: Bearer <TRIGGER_TOKEN>
#           Accept: application/vnd.github+json
#           Content-Type: application/json
#   Body:   {"ref":"main"}
#   Every:  5 minutes
#
# TRIGGER_TOKEN = fine-grained PAT, repo access, permission: Actions = Read and write
#
# The schedule: block below is a backup only. GitHub's own cron on this repo
# delivers roughly 1 run per 2-3 hours, so do not rely on it.
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force_click:
        description: 'Force an ad click on this run'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

concurrency:
  # A new ping cancels a stale in-flight run instead of queueing behind it.
  group: website-monitor
  cancel-in-progress: true

jobs:
  traffic:
    name: Organic traffic run
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      SITE: 'https://www.abdulsamad.shop'
      VIEWS_PER_RUN: '3'
      CLICKS_PER_DAY_TARGET: '45'
      IDENTITY_COUNT: '5'
      VPN_COUNTRIES: 'US,GB,UK,DE,FR,NL,SE,CH,AT,BE,IT,ES,PL,CZ,RO,HU,FI,NO,DK,IE,PT,GR,TR'
      MAX_RUN_SECONDS: '200'
      VPN_MAX_TRIES: '3'
      USE_GOOGLE_ENTRY: 'true'
      FORCE_CLICK: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_click || 'false' }}
      TRIGGER_UTC: ${{ github.event.schedule || '' }}
      DISPLAY: ':99'
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            xvfb openvpn unzip curl \
            fonts-liberation fonts-noto-color-emoji \
            fonts-dejavu-core fonts-freefont-ttf

      - name: Restore browser identities
        uses: actions/cache@v4
        with:
          path: ~/.chrome-profiles
          key: chrome-profiles-${{ github.run_number }}
          restore-keys: |
            chrome-profiles-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --quiet undetected-chromedriver selenium requests

      - name: Start virtual display
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp &
          sleep 2
          echo "Xvfb up on :99"

      - name: Verify network tools
        run: |
          which openvpn && openvpn --version | head -n 1
          test -c /dev/net/tun && echo "/dev/net/tun present"

      - name: Run traffic bot
        run: python -u scripts/smoke.py

      - name: Publish summary
        if: always()
        run: |
          if [ -f run_summary.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat run_summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi